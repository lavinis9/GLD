  <text x="159" y="57" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-weight="500" font-size="16" fill="#EAF4FF"><tspan fill="#6FC3FF">1</tspan> 0</text>
  <text x="40" y="120" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#8FB6DE">λογική</text>
  <text x="159" y="120" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#8FB6DE">hardware</text>
