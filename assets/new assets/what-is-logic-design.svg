<svg xmlns="http://www.w3.org/2000/svg" width="200" height="128" viewBox="0 0 200 128" role="img" aria-label="Από την ανθρώπινη λογική (λάμπα ιδέας) σε λειτουργικό hardware (ολοκληρωμένο κύκλωμα)">
