  <path d="M 124 88 L 214 88" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <text x="228" y="182"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="'Poppins', 'Segoe UI', 'Arial', sans-serif"
