<svg width="440" height="360" viewBox="0 0 440 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Λογότυπο GLD</title>
  <desc>Πύλη AND σε σκούρο μπλε με ανοιχτό μπλε τελείωμα και τα γράμματα GLD στο κέντρο</desc>
  <defs>
    <linearGradient id="gateFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123A6B"/>
      <stop offset="55%" stop-color="#0B2645"/>
      <stop offset="100%" stop-color="#081A30"/>
    </linearGradient>
    <linearGradient id="gateEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FC3FF"/>
      <stop offset="100%" stop-color="#2E7FD6"/>
    </linearGradient>
    <linearGradient id="pinFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7FD6"/>
      <stop offset="100%" stop-color="#6FC3FF"/>
    </linearGradient>
  </defs>

  <line x1="40" y1="128" x2="118" y2="128" stroke="#2E7FD6" stroke-width="13" stroke-linecap="round"/>
  <line x1="40" y1="232" x2="118" y2="232" stroke="#2E7FD6" stroke-width="13" stroke-linecap="round"/>
  <line x1="322" y1="180" x2="390" y2="180" stroke="#2E7FD6" stroke-width="13" stroke-linecap="round"/>

  <circle cx="40" cy="128" r="9" fill="#6FC3FF"/>
  <circle cx="40" cy="232" r="9" fill="#6FC3FF"/>
  <circle cx="390" cy="180" r="9" fill="#6FC3FF"/>

  <path d="M 118 80
           L 222 80
